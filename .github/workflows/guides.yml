name: Guides

# Builds the weekly guides to day hikes by train from config/guides.yml's
# cities with the live providers, publishes them as the guides-data release,
# and deploys them, telling search engines about their pages.
on:
  schedule:
    # Wednesdays, so the guides plan the coming Saturday's trips.
    - cron: "17 10 * * 3"
  workflow_dispatch:
    inputs:
      cities:
        description: Cities to rebuild, as config/guides.yml's slugs separated by commas (all when empty)
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Cities that fail or come out incomplete are built twice, with pauses between.
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      # Each build starts from the published guides, so hikes keep their pages and a bad day doesn't replace them.
      # Only the first build, before the release exists, starts without them.
      - name: Download the published guides
        run: bin/download-guides
      - name: Build the guides
        run: bin/rails guides:build
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
          # The log says which provider failed when a city's search does.
          RAILS_LOG_TO_STDOUT: "1"
          CITIES: ${{ inputs.cities }}
      - name: Publish the guides
        run: bin/publish-guides
      - name: Deploy them
        run: gh workflow run ci.yml --ref master --field indexnow=true
