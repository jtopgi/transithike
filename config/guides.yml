# Cities with weekly guides to day hikes by train, in the order they're listed,
# and the point trips start from. A city's guide is only published once a
# build finds at least GuideService::MIN_HIKES hikes from it. Check that a new
# city's hikes are its own: Philadelphia's were nearly all New York's, hours
# away, since few hiking routes are mapped near its train stations. Searches
# use OpenStreetMap's hiking route relations, which are rare near the train
# lines of Los Angeles, San Francisco, and Seattle, where trails are mostly
# mapped as paths alone, and Washington, DC's weekend trains reach only a few.
new-york-city:
  name: New York City
  origin: Midtown Manhattan
  latitude: 40.7536
  longitude: -73.9832
  time_zone: America/New_York
