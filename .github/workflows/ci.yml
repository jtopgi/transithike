name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/transithike_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: bin/rails db:prepare
      - run: bin/rails zeitwerk:check
      - run: bin/rails test
      - run: bin/rails test:system
      - run: bin/rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: bundle exec brakeman --no-pager
      - run: bundle exec bundler-audit check --update
      - run: yarn audit

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: transithike:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the production image without a database
        run: |
          set -euo pipefail
          docker run --detach --name transithike --publish 3000:3000 \
            --env SECRET_KEY_BASE="$(openssl rand -hex 64)" transithike:ci
          # Health probes use plain HTTP; everything else must be redirected to HTTPS.
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:3000/up
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/)" = 301
          https=(--silent --show-error --header "X-Forwarded-Proto: https")
          curl --fail "${https[@]}" --output page.html http://localhost:3000/
          grep --quiet "New Search" page.html
          stylesheet=$(grep --only-matching --max-count 1 '/assets/application-[^"]*\.css' page.html)
          curl --fail "${https[@]}" --output application.css "http://localhost:3000${stylesheet}"
          grep --quiet btn-primary application.css
          status=$(curl "${https[@]}" --output search.html --write-out '%{http_code}' \
            "http://localhost:3000/search?origin=&maximum_length=5")
          test "$status" = 422
          grep --quiet "Enter an origin" search.html
          grep --quiet "https://transitous.org/sources/" search.html
      - name: Show container logs
        if: always()
        run: docker logs transithike || true

  deploy:
    needs: [test, security, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP: ${{ vars.AZURE_CONTAINER_APP }}
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/transithike:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$REGISTRY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
      - name: Deploy to Azure Container Apps
        id: deploy
        run: |
          az containerapp update --name "$APP" --resource-group "$GROUP" --image "$IMAGE" --output none
          fqdn=$(az containerapp show --name "$APP" --resource-group "$GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          revision=$(az containerapp show --name "$APP" --resource-group "$GROUP" \
            --query properties.latestRevisionName --output tsv)
          revision_fqdn=$(az containerapp revision show --name "$APP" --resource-group "$GROUP" \
            --revision "$revision" --query properties.fqdn --output tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
          echo "revision-url=https://$revision_fqdn" >> "$GITHUB_OUTPUT"
      # Check the new revision directly: if it fails to start, the app URL keeps
      # serving the previous revision. The first request may wait for a cold start.
      - name: Check the deployed revision
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 6 --retry-delay 10 --retry-all-errors \
            "$REVISION_URL/up"
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$URL/"
        env:
          REVISION_URL: ${{ steps.deploy.outputs.revision-url }}
          URL: ${{ steps.deploy.outputs.url }}
