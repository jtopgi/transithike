name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/transithike_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: bin/rails db:prepare
      - run: bin/rails zeitwerk:check
      - run: bin/rails test
      - run: bin/rails test:system
      - run: bin/rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: bundle exec brakeman --no-pager
      - run: bundle exec bundler-audit check --update
      - run: yarn audit

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: transithike:ci
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the production image without a database
        run: |
          set -euo pipefail
          docker run --detach --name transithike --publish 3000:3000 \
            --env SECRET_KEY_BASE="$(openssl rand -hex 64)" transithike:ci
          # Health probes use plain HTTP; everything else must be redirected to HTTPS.
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:3000/up
          # Deployments wait for this header to report the new commit.
          curl --silent --dump-header - --output /dev/null http://localhost:3000/up |
            tr -d '\r' | grep --quiet --ignore-case "^x-app-revision: $GITHUB_SHA$"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/)" = 301
          https=(--silent --show-error --header "X-Forwarded-Proto: https")
          curl --fail "${https[@]}" --dump-header headers.txt --output page.html http://localhost:3000/
          grep --quiet "Find hikes" page.html
          # Browsers send the session cookie back with every later request.
          cookie=$(tr -d '\r' < headers.txt | sed -n -E 's/^[Ss]et-[Cc]ookie: ([^;]+).*/\1/p')
          test -n "$cookie"
          curl --fail "${https[@]}" --header "Cookie: $cookie" --output /dev/null http://localhost:3000/
          stylesheet=$(grep --only-matching --max-count 1 '/assets/application-[^"]*\.css' page.html)
          curl --fail "${https[@]}" --output application.css "http://localhost:3000${stylesheet}"
          grep --quiet btn-primary application.css
          status=$(curl "${https[@]}" --header "Cookie: $cookie" --output search.html --write-out '%{http_code}' \
            "http://localhost:3000/search?origin=")
          test "$status" = 422
          grep --quiet "Enter a starting point" search.html
          grep --quiet "https://transitous.org/sources/" search.html
          # Origins' local times need the container's time zone data.
          docker exec transithike bin/rails runner 'exit ActiveSupport::TimeZone["America/Los_Angeles"].now.zone.start_with?("P")'
      - name: Show container logs
        if: always()
        run: docker logs transithike || true

  deploy:
    needs: [test, security, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP: ${{ vars.AZURE_WEBAPP }}
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/transithike:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$REGISTRY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Deploy to Azure App Service
        id: deploy
        run: |
          az webapp config container set --name "$APP" --resource-group "$GROUP" \
            --container-image-name "$IMAGE" --output none
          host=$(az webapp show --name "$APP" --resource-group "$GROUP" --query defaultHostName --output tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
      # App Service keeps serving the previous build until the new container is ready.
      - name: Wait for the new build to serve traffic
        run: |
          for _ in $(seq 1 40); do
            revision=$(curl --silent --max-time 30 --dump-header - --output /dev/null "$URL/up" |
              tr -d '\r' | sed -n -E 's/^x-app-revision: *//Ip')
            if [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::The new build was not serving traffic after 10 minutes."
          exit 1
        env:
          URL: ${{ steps.deploy.outputs.url }}
      - name: Load the site twice, as a browser does, returning the session cookie
        run: |
          curl --fail --silent --show-error --max-time 60 --cookie-jar cookies.txt --output /dev/null "$URL/"
          curl --fail --silent --show-error --max-time 60 --cookie cookies.txt --output /dev/null "$URL/"
        env:
          URL: ${{ steps.deploy.outputs.url }}
      # Uses the live providers; an outage there is reported without failing the deployment.
      # Results stream in as Server-Sent Events; the first one arriving well before
      # the last shows the platform isn't holding the stream back.
      - name: Run a real search
        run: |
          read -r status first total < <(curl --silent --show-error --no-buffer --max-time 240 --output search.txt \
            --write-out '%{http_code} %{time_starttransfer} %{time_total}\n' \
            --get "$URL/search/stream" --data-urlencode "origin=Grand Central Terminal, New York" \
            --data-urlencode "lat=40.7527" --data-urlencode "lon=-73.9772" --data-urlencode "day=saturday")
          echo "HTTP $status: first event after ${first}s, done after ${total}s."
          if [ "$status" != 200 ]; then echo "::error::The search stream returned HTTP $status."; exit 1; fi
          if grep --quiet "^event: failure" search.txt; then
            echo "::warning::A search provider was unavailable, but the app handled it: $(grep -A1 '^event: failure' search.txt | tail -1)"
          else
            grep --quiet "^event: trails" search.txt && grep --quiet "^event: done" search.txt
          fi
        env:
          URL: ${{ steps.deploy.outputs.url }}
